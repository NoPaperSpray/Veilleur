[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veilleur-discord-mcp"
version = "0.1.0"
description = "Local Discord MCP server with human approval and backups"
readme = "README.pypi.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "NoPaperSpray"}]
keywords = ["discord", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications :: Chat",
]
dependencies = ["mcp>=1.28,<2", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.urls]
Homepage = "https://github.com/NoPaperSpray/Veilleur"
Issues = "https://github.com/NoPaperSpray/Veilleur/issues"

[project.scripts]
veilleur-discord-mcp = "veilleur.server:main"

[tool.setuptools]
packages = ["veilleur"]
